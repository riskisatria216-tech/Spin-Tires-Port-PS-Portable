name: Build PSP homebrew
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EBOOT.PBP
        run: |
          export PSPDEV=/opt/pspdev
          export PSPSDK=$PSPDEV/psp/sdk
          export PATH=$PATH:$PSPDEV/bin:$PSPSDK/bin
          make
      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: MudRunner-PSP-Prototype-0.1
          path: EBOOT.PBP
